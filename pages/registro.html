<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="register-title">Registrarse - Entre Copas</title>
    <link rel="stylesheet" href="../css/style.css">
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet">
</head>

<body>
    <header id="main-header" class="scrolled">
        <div class="logo">
            <a href="../index.html" class="brand-link">
                <img src="../assets/logo2.0.png" alt="Logo" class="brand-logo">
                Entre Copas
            </a>
        </div>
        <nav class="nav-links">
            <a href="explorar.html" data-i18n="nav-explore">Explorar</a>
            <a href="panel.html" data-i18n="nav-panel">Panel</a>
            <a href="trabaja-con-nosotros.html" data-i18n="nav-partner">Asociarse</a>
            <a href="registro.html" class="nav-icon-link" aria-label="Registrarse">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
            <a href="reservas.html" class="nav-icon-link cart-link" aria-label="Carrito de compras">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge hidden">0</span>
            </a>
            <div class="lang-selector-container">
                <select id="lang-select" aria-label="Cambiar idioma">
                    <option value="es">ESP</option>
                    <option value="en">ENG</option>
                    <option value="pt">POR</option>
                </select>
            </div>
        </nav>
    </header>

    <main class="page-content pt-header">
        <section class="section container" style="display: flex; justify-content: center;">
            <div class="reservation-form-container" style="max-width: 500px; width: 100%;">
                <div style="text-align: center; margin-bottom: var(--space-lg);">
                    <h1 data-i18n="register-h1">Únete a la Experiencia</h1>
                    <p style="margin-top: var(--space-sm); color: var(--on-surface-variant);"
                        data-i18n="register-subtitle">Crea tu cuenta para acceder a reservas exclusivas y eventos
                        privados.</p>
                </div>
                <form id="registro-form" class="form-wrapper">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre" data-i18n="form-first-name">Nombre</label>
                            <input type="text" id="nombre" name="nombre" required class="form-control"
                                placeholder="Tu nombre" data-i18n-placeholder="form-first-name-placeholder">
                        </div>
                        <div class="form-group">
                            <label for="apellido" data-i18n="form-last-name">Apellido</label>
                            <input type="text" id="apellido" name="apellido" required class="form-control"
                                placeholder="Tu apellido" data-i18n-placeholder="form-last-name-placeholder">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email_reg" data-i18n="form-email">Correo Electrónico</label>
                        <input type="email" id="email_reg" name="email" required class="form-control"
                            placeholder="tu@email.com" data-i18n-placeholder="form-email-placeholder">
                    </div>

                    <div class="form-group">
                        <label for="password" data-i18n="form-password">Contraseña</label>
                        <input type="password" id="password" name="password" required class="form-control"
                            placeholder="Mínimo 8 caracteres" data-i18n-placeholder="form-password-placeholder">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-md" data-i18n="register-btn">Crear
                        Cuenta</button>

                    <div style="text-align: center; margin-top: var(--space-md); font-size: 14px;">
                        <span data-i18n="register-already">¿Ya tienes una cuenta?</span> <a href="#"
                            style="font-weight: 700; color: var(--primary); text-decoration: underline;"
                            data-i18n="register-login-link">Iniciar Sesión</a>
                    </div>

                    <div id="registro-message" class="form-message hidden">
                        <!-- JS will inject success message here -->
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-logo">ENTRE COPAS</div>
            <div class="footer-links">
                <a href="#" data-i18n="footer-heritage">Herencia</a>
                <a href="trabaja-con-nosotros.html" data-i18n="footer-work">Trabaja con Nosotros</a>
                <a href="#" data-i18n="footer-privacy">Privacidad</a>
                <a href="#" data-i18n="footer-terms">Términos</a>
                <a href="#" data-i18n="footer-concierge">Conserje</a>
            </div>
            <div class="copyright" data-i18n="footer-copyright">
                © 2024 ENTRE COPAS. Viticultura y Ceremonia.
            </div>
        </div>
    </footer>

    <script type="module" src="../js/main.js"></script>


<div id="n8n-chat"></div>
<script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
        webhookUrl: 'http://localhost:5678/webhook/5b10a946-58e7-4fd5-8341-70388b37becc/chat',
        webhookConfig: {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            }
        },
        target: '#n8n-chat',
        mode: 'window',
        chatInputKey: 'chatInput',
        chatSessionKey: 'sessionId',
        loadPreviousSession: true,
        metadata: {},
        showWelcomeScreen: true,
        defaultLanguage: 'es',
        initialMessages: [
            '¡Hola! 👋',
            'Soy tu asistente virtual de Entre Copas. ¿En qué puedo ayudarte hoy?'
        ],
        i18n: {
            es: {
                title: 'Entre Copas',
                subtitle: 'Tu asistente de experiencias en bodegas.',
                footer: '',
                getStarted: 'Nueva Conversación',
                inputPlaceholder: 'Escribe tu pregunta aquí...',
            },
        },
        enableStreaming: false,
    });
</script>
</body>

</html>
